# SocEyes — multi-host deployment
#
# Server host (runs the brain):
#   docker compose -f docker-compose.multihost.yml up -d
#   Dashboard/API on port 8000. State in ./state. No packet capture here.
#
# Sensor hosts (each monitored machine, incl. other containers/VMs' traffic):
#   SOC_API_URL=http://<server-ip>:8000 SOC_AGENT_INTERFACE=eth0 \
#     docker compose -f docker-compose.multihost.yml --profile sensor up -d soceyes-agent
#   The agent captures AF_PACKET (needs NET_RAW) and ships batches to the
#   server; short server outages are buffered, not dropped.
#
# Scan-detection tuning (server side, optional):
#   SOC_SCAN_WINDOW_SEC (60), SOC_SCAN_PORT_THRESHOLD (20),
#   SOC_SCAN_BURST_SEC (15), SOC_SCAN_COOLDOWN_SEC (300),
#   SOC_SCAN_SUPPRESS_LOOPBACK (true)

services:
  soceyes-server:
    build: .
    container_name: soceyes-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SOC_PORT: "8000"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      NVIDIA_MODEL: "${NVIDIA_MODEL:-meta/llama-3.2-11b-vision-instruct}"
      SOC_RESPONSE_DRY_RUN: "${SOC_RESPONSE_DRY_RUN:-true}"
      RETENTION_HOURS: "${RETENTION_HOURS:-168}"
    volumes:
      - ./state:/data/state
    env_file:
      - path: .env
        required: false

  soceyes-agent:
    build: .
    image: soceyes:latest
    container_name: soceyes-agent
    restart: unless-stopped
    profiles: ["sensor"]
    command: ["/app/bin/soceyes-agent"]
    environment:
      # The agent process exits with a clear message when either is missing.
      SOC_API_URL: "${SOC_API_URL:-UNSET — set SOC_API_URL=http://<server-ip>:8000}"
      SOC_AGENT_INTERFACE: "${SOC_AGENT_INTERFACE:-UNSET — set SOC_AGENT_INTERFACE=eth0}"
      SOC_AGENT_BATCH_SIZE: "${SOC_AGENT_BATCH_SIZE:-10}"
      SOC_AGENT_FLUSH_SECONDS: "${SOC_AGENT_FLUSH_SECONDS:-2}"
      SOC_AGENT_MAX_BUFFERED: "${SOC_AGENT_MAX_BUFFERED:-50000}"
    network_mode: host
    cap_add:
      - NET_RAW
    pid: "host"
