name = "zeroclaw_runtime"
description = "Collects live status from the mounted ZeroClaw CLI."
prompt = "Inspect the actual ZeroClaw runtime and publish the current status output."
knowledge = ["Use the real zeroclaw binary when it is available in the runtime."]
allowed_tools = ["state_files", "zeroclaw_cli"]
